<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>ناوون - بوابة المندوب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="navbar">
    <h2><i class="fa-solid fa-truck-fast"></i> تطبيق المندوب</h2>
</div>

<div class="container">
    <div class="card">
        <h3>تسجيل دخول المندوب</h3>
        <input type="text" id="myPhone" placeholder="رقم هاتفك المسجل">
        <input type="text" id="myName" placeholder="اسمك الكريم">
        <button onclick="loadMyOrders()">عرض طلباتي</button>
    </div>

    <div id="myOrdersList"></div>
</div>

<script>
    const API_URL = "ضع_رابط_جوجل_سكريبت_الجديد_هنا"; 
    const ADMIN_PHONE = "96800000000"; // ⚠️ ضع رقم الواتساب الخاص بالإدارة هنا مع رمز الدولة

    function loadMyOrders() {
        const phone = document.getElementById('myPhone').value;
        const name = document.getElementById('myName').value;
        if(!phone || !name) return alert("أدخل بياناتك كاملة");

        fetch(API_URL + "?action=get_driver_orders&driverPhone=" + phone)
        .then(res => res.json())
        .then(data => {
            let html = '';
            data.forEach(order => {
                if(order.status !== 'تم التوصيل') {
                    html += `
                    <div class="card">
                        <span class="status-badge status-waiting">${order.status}</span>
                        <h3>طلب #${order.orderId}</h3>
                        <p><i class="fa-solid fa-phone"></i> <strong>رقم الزبون:</strong> ${order.customerPhone}</p>
                        <p><i class="fa-solid fa-map-location-dot"></i> <strong>التفاصيل:</strong> ${order.details}</p>
                        
                        <div class="grid-2">
                            <button onclick="acceptOrder('${order.orderId}')"><i class="fa-solid fa-check"></i> استلمت الطلب</button>
                            <button class="btn-whatsapp" onclick="notifyAdmin('${order.orderId}')"><i class="fa-brands fa-whatsapp"></i> إشعار الإدارة</button>
                        </div>
                    </div>`;
                }
            });
            document.getElementById('myOrdersList').innerHTML = html || '<h3 style="text-align:center;">لا توجد طلبات جديدة.</h3>';
        });
    }

    function acceptOrder(orderId) {
        const phone = document.getElementById('myPhone').value;
        const name = document.getElementById('myName').value;
        
        fetch(API_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ 'action': 'update_status', 'orderId': orderId, 'status': 'المندوب في الطريق', 'driverPhone': phone, 'driverName': name })
        }).then(res => res.json()).then(data => {
            alert('تم التحديث! الزبون الآن يرى أنك في الطريق.');
            loadMyOrders();
        });
    }

    function notifyAdmin(orderId) {
        const name = document.getElementById('myName').value;
        const msg = encodeURIComponent(`مرحباً إدارة ناوون، أنا المندوب ${name}. لقد استلمت الطلب رقم ${orderId} وأنا في طريقي للعميل.`);
        window.open(`https://wa.me/${ADMIN_PHONE}?text=${msg}`, '_blank');
    }
</script>
</body>
</html>
