<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة المندوب</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="navbar">
    <h2><i class="fa-solid fa-truck-fast"></i> تطبيق المندوب</h2>
    <span id="driverNameDisplay" style="font-weight:bold;"></span>
</div>

<div class="container">
    <div class="card" style="text-align:center; background:#e0f2fe; border-color:#bae6fd;">
        <i class="fa-solid fa-satellite-dish" style="color:#0ea5e9; font-size:24px;"></i>
        <p style="margin:5px 0 0 0; color:#0369a1; font-weight:bold;">نظام التتبع (GPS) يعمل في الخلفية</p>
    </div>

    <h3>الطلبات المسندة إليك:</h3>
    <div id="myOrdersList">جاري التحميل...</div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyJ5lfUHtBfbn-0sJBzpMvBTYd85zeXtybpLr1NOhnI1P2eQAHesMdUugD8tvYOlQvj/exec"; // ⚠️ ضع الرابط هنا
    const myPhone = localStorage.getItem("driverPhone");
    const myName = localStorage.getItem("driverName");
    const ADMIN_PHONE = "96800000000"; // رقم الإدارة

    if(!myPhone) window.location.href = "index.html";
    document.getElementById('driverNameDisplay').innerText = myName;

    function loadMyOrders() {
        fetch(API_URL + "?action=get_driver_orders&driverPhone=" + myPhone)
        .then(res => res.json())
        .then(data => {
            let html = '';
            data.forEach(order => {
                if(order.status !== 'تم التوصيل') {
                    html += `
                    <div class="card">
                        <span class="status-badge" style="background:#ef4444;">${order.status}</span>
                        <h3>طلب #${order.orderId}</h3>
                        <p><strong>رقم الزبون:</strong> <a href="tel:${order.customerPhone}">${order.customerPhone}</a></p>
                        <p><strong>التفاصيل:</strong> ${order.details}</p>
                        
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top:15px;">
                            <button onclick="updateStatus('${order.orderId}', 'المندوب في الطريق')" style="background:#3b82f6;">في الطريق</button>
                            <button onclick="updateStatus('${order.orderId}', 'تم التوصيل')" style="background:#10b981;">تم التوصيل</button>
                        </div>
                        <button onclick="notifyAdmin('${order.orderId}')" style="background:#25D366; margin-top:10px;"><i class="fa-brands fa-whatsapp"></i> واتساب للإدارة</button>
                    </div>`;
                }
            });
            document.getElementById('myOrdersList').innerHTML = html || '<h3>لا توجد طلبات جديدة.</h3>';
        });
    }

    function updateStatus(orderId, newStatus) {
        if(newStatus === 'تم التوصيل' && !confirm('هل أنت متأكد من تسليم الطلب للعميل؟')) return;
        
        fetch(API_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ 'action': 'update_status', 'orderId': orderId, 'status': newStatus })
        }).then(res => res.json()).then(data => loadMyOrders());
    }

    function notifyAdmin(orderId) {
        const msg = encodeURIComponent(`أنا المندوب ${myName}، بخصوص الطلب ${orderId}`);
        window.open(`https://wa.me/${ADMIN_PHONE}?text=${msg}`, '_blank');
    }

    // تشغيل التتبع في الخلفية كل 30 ثانية
    function startTracking() {
        if (navigator.geolocation) {
            setInterval(() => {
                navigator.geolocation.getCurrentPosition((position) => {
                    fetch(API_URL, {
                        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams({ 'action': 'update_location', 'driverPhone': myPhone, 'lat': position.coords.latitude, 'lng': position.coords.longitude })
                    });
                }, (e) => console.log("GPS Error"), { enableHighAccuracy: true });
            }, 30000); // 30 ثانية
        }
    }

    window.onload = () => { loadMyOrders(); startTracking(); };
</script>
</body>
</html>
