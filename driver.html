<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نعاون - المندوب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="navbar">
    <div style="display: flex; align-items: center; gap: 10px;">
        <img src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAERQANpnvj_AAG8qV7sGOoQYGaP5XpFHFUAAposAAK-s_lUrAzi0ByJX3E6BA.jpg" class="pulsing-logo">
        <h2 style="margin:0; font-size: 16px;">المندوب: <span id="dName"></span></h2>
    </div>
</div>
<div class="container">
    <div id="ordersList">جاري التحميل...</div>
</div>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwmJKbtJ8shNL2a1epk1KVcdP_WNw37MMHsK-eGPDjlr_oj--vwLZmTnWFHh-7xVOcZ/exec"; 
    const myPhone = localStorage.getItem("driverPhone");
    document.getElementById('dName').innerText = localStorage.getItem("driverName");

    async function loadOrders() {
        const res = await fetch(API_URL + "?action=get_driver_orders&driverPhone=" + myPhone);
        const data = await res.json();
        let html = '';
        data.forEach(o => {
            if(o.status !== 'تم التوصيل') {
                html += `<div class="card">
                    <h3>طلب #${o.orderId}</h3>
                    <p>${o.details}</p>
                    <button onclick="updateStatus('${o.orderId}', this)" style="background:#2ecc71;">تأكيد التسليم</button>
                </div>`;
            }
        });
        document.getElementById('ordersList').innerHTML = html || 'لا توجد طلبات.';
    }

    async function updateStatus(id, btn) {
        if(!confirm("تأكيد التسليم؟")) return;
        btn.disabled = true; btn.innerText = "جاري الحفظ...";
        const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({'action': 'update_status', 'orderId': id, 'status': 'تم التوصيل'})
        });
        const data = await res.json();
        if(data.status === "success") { alert("تم!"); loadOrders(); }
    }
    window.onload = loadOrders;
</script>
</body>
</html>
