<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نعاون - الإدارة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="navbar">
    <div style="display: flex; align-items: center; gap: 10px;">
        <img src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAERQANpnvj_AAG8qV7sGOoQYGaP5XpFHFUAAposAAK-s_lUrAzi0ByJX3E6BA.jpg" class="pulsing-logo">
        <h2 style="margin:0;">إدارة نعاون</h2>
    </div>
</div>
<div class="container">
    <div id="adminOrders">جاري التحميل...</div>
</div>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwmJKbtJ8shNL2a1epk1KVcdP_WNw37MMHsK-eGPDjlr_oj--vwLZmTnWFHh-7xVOcZ/exec"; 
    let drivers = [];

    async function loadAdmin() {
        const dRes = await fetch(API_URL + "?action=get_active_drivers");
        drivers = await dRes.json();
        const oRes = await fetch(API_URL + "?action=get_all_orders");
        const orders = await oRes.json();
        
        let options = '<option value="">اختر مندوباً...</option>';
        drivers.forEach(d => options += `<option value="${d.phone}|${d.name}">${d.name} (${d.activeOrders} طلبات)</option>`);
        
        let html = '';
        orders.reverse().forEach(o => {
            if(o.status !== 'تم التوصيل') {
                html += `<div class="card">
                    <h3>#${o.orderId} - ${o.status}</h3>
                    <p>${o.details}</p>
                    ${!o.driverPhone ? `<select id="s-${o.orderId}">${options}</select><button onclick="assign('${o.orderId}')">إسناد</button>` : `<p>المندوب: ${o.driverName}</p>`}
                </div>`;
            }
        });
        document.getElementById('adminOrders').innerHTML = html;
    }

    async function assign(id) {
        const val = document.getElementById('s-'+id).value;
        if(!val) return;
        const [p, n] = val.split('|');
        await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({'action': 'assign_order', 'orderId': id, 'driverPhone': p, 'driverName': n})
        });
        loadAdmin();
    }
    window.onload = loadAdmin;
</script>
</body>
</html>
