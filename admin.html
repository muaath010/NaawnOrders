<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة ناوون</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="navbar">
    <h2><i class="fa-solid fa-user-tie"></i> غرفة تحكم ناوون</h2>
    <button onclick="window.location.href='index.html'" style="width:auto; padding:8px 15px; background:#e74c3c;">خروج</button>
</div>

<div class="container">
    <button onclick="loadAdminData()" style="background-color: #2c3e50;"><i class="fa-solid fa-arrows-rotate"></i> تحديث الطلبات والمناديب</button>

    <h3 style="color: #d35400; border-bottom: 2px solid #d35400; padding-bottom: 10px; margin-top: 30px;"><i class="fa-solid fa-spinner fa-spin"></i> الطلبات قيد الانتظار والنشطة</h3>
    <div id="activeOrdersList"></div>

    <h3 style="color: #27ae60; border-bottom: 2px solid #27ae60; padding-bottom: 10px; margin-top: 40px;"><i class="fa-solid fa-check-double"></i> السجل (المكتملة)</h3>
    <div id="completedOrdersList"></div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxlU45tFc9sJtd-8F8QSPO-05P_YGSu2wuGsNFyK5kvn8thIu4yum-8lQKKd11uXGVv/exec"; // ⚠️ ضع الرابط هنا
    let activeDrivers = [];

    function loadAdminData() {
        document.getElementById('activeOrdersList').innerHTML = 'جاري التحميل...';
        
        // 1. جلب المناديب المتواجدين أولاً
        fetch(API_URL + "?action=get_active_drivers").then(res => res.json()).then(drivers => {
            activeDrivers = drivers;
            // 2. جلب الطلبات
            fetch(API_URL + "?action=get_all_orders").then(res => res.json()).then(orders => {
                renderOrders(orders);
            });
        });
    }

    function renderOrders(orders) {
        let activeHtml = '';
        let completedHtml = '';

        // إنشاء قائمة منسدلة للمناديب المتواجدين
        let driversOptions = '<option value="">اختر مندوباً متواجداً...</option>';
        activeDrivers.forEach(d => {
            driversOptions += `<option value="${d.phone}|${d.name}">${d.name} (${d.phone})</option>`;
        });

        orders.reverse().forEach(order => {
            const isCompleted = order.status === 'تم التوصيل';
            let assignSection = '';

            // إذا لم يتم التعيين بعد
            if(!order.driverPhone && !isCompleted) {
                assignSection = `
                <div style="margin-top:15px; background:#f8fafc; padding:10px; border-radius:8px;">
                    <select id="select-${order.orderId}">${driversOptions}</select>
                    <button onclick="assignOrderToDriver('${order.orderId}')" style="padding:8px; font-size:14px; margin-top:5px;">إسناد الطلب للمندوب</button>
                </div>`;
            }

            const orderCard = `
            <div class="card" style="border-right: 5px solid ${isCompleted ? '#10b981' : (order.driverPhone ? '#3498db' : '#e74c3c')};">
                <span class="status-badge" style="background:${isCompleted ? '#10b981' : '#f59e0b'};">${order.status}</span>
                <strong style="font-size:18px; float:left;">#${order.orderId}</strong>
                <div style="clear:both; margin-bottom:10px;"></div>
                <p><strong>العميل:</strong> ${order.customerPhone}</p>
                <p><strong>التفاصيل:</strong> ${order.details}</p>
                <p><strong>المندوب الحالي:</strong> <span style="color:#2980b9;">${order.driverName || 'لم يتم التعيين'}</span></p>
                ${assignSection}
            </div>`;

            if(isCompleted) completedHtml += orderCard;
            else activeHtml += orderCard;
        });

        document.getElementById('activeOrdersList').innerHTML = activeHtml || '<p>لا توجد طلبات نشطة.</p>';
        document.getElementById('completedOrdersList').innerHTML = completedHtml || '<p>لا توجد طلبات مكتملة.</p>';
    }

    function assignOrderToDriver(orderId) {
        const selectObj = document.getElementById(`select-${orderId}`).value;
        if(!selectObj) return alert("الرجاء اختيار مندوب");
        
        const [driverPhone, driverName] = selectObj.split('|');
        
        fetch(API_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ 'action': 'assign_order', 'orderId': orderId, 'driverPhone': driverPhone, 'driverName': driverName })
        }).then(res => res.json()).then(data => {
            alert('تم إسناد الطلب بنجاح!');
            loadAdminData();
        });
    }

    window.onload = loadAdminData;
</script>
</body>
</html>
