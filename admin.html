<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>ناوون - لوحة الإدارة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" style="max-width: 800px;">
    <h1>إدارة عمليات التوصيل</h1>
    <button onclick="loadOrders()" style="background-color: #2c3e50;">تحديث قائمة الطلبات</button>
    <div id="ordersList" style="margin-top: 20px;"></div>
</div>

<script>
    // ⚠️ ضع الرابط الذي نسخته من جوجل سكريبت هنا
    const API_URL = "ضع_رابط_جوجل_سكريبت_هنا"; 

    function loadOrders() {
        document.getElementById('ordersList').innerHTML = '<h2>جاري جلب الطلبات...</h2>';
        fetch(API_URL + "?action=get_all_orders")
        .then(res => res.json())
        .then(data => {
            let html = '';
            // عرض الطلبات من الأحدث للأقدم
            data.reverse().forEach(order => {
                html += `
                <div class="card">
                    <h3>طلب #${order.orderId} <span class="status-badge">${order.status}</span></h3>
                    <p><strong>رقم الزبون:</strong> ${order.customerPhone}</p>
                    <p><strong>التفاصيل:</strong> ${order.details}</p>
                    <input type="text" id="driver-${order.orderId}" placeholder="رقم هاتف المندوب" value="${order.driverPhone !== 'غير محدد' ? order.driverPhone : ''}">
                    <button onclick="assignDriver('${order.orderId}')">تحديث وتعيين للمندوب</button>
                </div>`;
            });
            document.getElementById('ordersList').innerHTML = html || '<p>لا توجد طلبات مسجلة.</p>';
        });
    }

    function assignDriver(orderId) {
        const driverPhone = document.getElementById(`driver-${orderId}`).value;
        fetch(API_URL, {
            method: 'POST', 
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ 'action': 'update_status', 'orderId': orderId, 'status': 'جاري التوصيل', 'driverPhone': driverPhone })
        }).then(res => res.json()).then(data => {
            alert('تم إسناد الطلب للمندوب بنجاح!');
            loadOrders();
        });
    }
    
    window.onload = loadOrders;
</script>
</body>
</html>
