<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نعاون - الدخول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" style="max-width: 400px; text-align: center;">
    <img src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAERQANpnvj_AAG8qV7sGOoQYGaP5XpFHFUAAposAAK-s_lUrAzi0ByJX3E6BA.jpg" class="pulsing-logo" style="width: 80px; height: 80px;">
    <h1 style="color: var(--text-dark);">نعاون للتوصيل</h1>
    <div class="card">
        <input type="text" id="d_user" placeholder="اسم المندوب">
        <input type="number" id="d_id" placeholder="رقم البطاقة">
        <input type="password" id="d_pass" placeholder="كلمة المرور">
        <button id="dBtn" onclick="loginDriver()">دخول المندوب</button>
        <hr>
        <button onclick="location.href='customer.html'" class="btn-outline">دخول العميل</button>
    </div>
</div>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwmJKbtJ8shNL2a1epk1KVcdP_WNw37MMHsK-eGPDjlr_oj--vwLZmTnWFHh-7xVOcZ/exec"; 
    async function loginDriver() {
        const btn = document.getElementById('dBtn');
        btn.disabled = true; btn.innerText = "جاري التحقق...";
        const res = await fetch(API_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({'action': 'login_driver', 'username': document.getElementById('d_user').value, 'idCard': document.getElementById('d_id').value, 'password': document.getElementById('d_pass').value})
        });
        const data = await res.json();
        if(data.status === "success") {
            localStorage.setItem("driverPhone", data.phone); localStorage.setItem("driverName", data.name);
            window.location.href = "driver.html";
        } else { alert(data.message); btn.disabled = false; btn.innerText = "دخول المندوب"; }
    }
</script>
</body>
</html>
