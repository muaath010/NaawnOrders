<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ناوون لخدمات التوصيل - الدخول</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; color: #64748b; }
        .tab.active { color: #f59e0b; border-bottom: 3px solid #f59e0b; }
        .form-section { display: none; }
        .form-section.active { display: block; }
    </style>
</head>
<body>
<div class="container" style="max-width: 400px; margin-top: 50px;">
    <h2 style="text-align: center; color: #f59e0b;"><i class="fa-solid fa-motorcycle"></i> ناوون للتوصيل</h2>
    
    <div class="tabs">
        <div class="tab active" onclick="switchTab('customer')">عميل</div>
        <div class="tab" onclick="switchTab('driver')">مندوب</div>
        <div class="tab" onclick="switchTab('admin')">إدارة</div>
    </div>

    <div id="customer" class="form-section active">
        <input type="text" id="c_phone" placeholder="رقم هاتفك">
        <button onclick="loginCustomer()">متابعة كعميل</button>
    </div>

    <div id="driver" class="form-section">
        <input type="text" id="d_user" placeholder="اسم المستخدم">
        <input type="text" id="d_id" placeholder="رقم البطاقة">
        <input type="password" id="d_pass" placeholder="كلمة المرور">
        <button onclick="loginDriver()">تسجيل الدخول للمندوب</button>
    </div>

    <div id="admin" class="form-section">
        <input type="text" id="a_user" placeholder="اسم المستخدم">
        <input type="password" id="a_pass" placeholder="كلمة المرور">
        <button onclick="loginAdmin()">دخول الإدارة</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxlU45tFc9sJtd-8F8QSPO-05P_YGSu2wuGsNFyK5kvn8thIu4yum-8lQKKd11uXGVv/exec"; // ⚠️ ضع الرابط هنا

    function switchTab(tabId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    function loginCustomer() {
        const phone = document.getElementById('c_phone').value;
        if(!phone) return alert("أدخل رقم الهاتف");
        localStorage.setItem("customerPhone", phone);
        window.location.href = "customer.html";
    }

    function loginDriver() {
        const user = document.getElementById('d_user').value;
        const id = document.getElementById('d_id').value;
        const pass = document.getElementById('d_pass').value;
        event.target.innerText = "جاري التحقق...";

        fetch(API_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ 'action': 'login_driver', 'username': user, 'idCard': id, 'password': pass })
        }).then(res => res.json()).then(data => {
            if(data.status === "success") {
                localStorage.setItem("driverPhone", data.phone);
                localStorage.setItem("driverName", data.name);
                window.location.href = "driver.html";
            } else { alert(data.message); event.target.innerText = "تسجيل الدخول للمندوب"; }
        });
    }

    function loginAdmin() {
        const user = document.getElementById('a_user').value;
        const pass = document.getElementById('a_pass').value;
        event.target.innerText = "جاري التحقق...";

        fetch(API_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ 'action': 'login_admin', 'username': user, 'password': pass })
        }).then(res => res.json()).then(data => {
            if(data.status === "success") { window.location.href = "admin.html"; } 
            else { alert(data.message); event.target.innerText = "دخول الإدارة"; }
        });
    }
</script>
</body>
</html>
