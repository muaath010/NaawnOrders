<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نعاون - العميل</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="navbar">
    <div style="display: flex; align-items: center; gap: 10px;">
        <img src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAERQANpnvj_AAG8qV7sGOoQYGaP5XpFHFUAAposAAK-s_lUrAzi0ByJX3E6BA.jpg" class="pulsing-logo">
        <h2 style="margin:0;">نعاون</h2>
    </div>
    <span>بوابة العملاء</span>
</div>
<div class="container">
    <div class="card">
        <h3>طلب جديد</h3>
        <textarea id="orderDetails" rows="4" placeholder="اكتب تفاصيل الطلب..."></textarea>
        <button id="sBtn" onclick="submitOrder()">تأكيد وإرسال الطلب</button>
    </div>
</div>
<script>
    const API_URL = "ضع_رابط_جوجل_سكريبت_هنا"; 
    const ADMIN_PHONE = "96800000000"; 
    
    function submitOrder() {
        const details = document.getElementById('orderDetails').value;
        if(!details) return alert("اكتب التفاصيل");
        const btn = document.getElementById('sBtn');
        btn.disabled = true; btn.innerText = "جاري التحويل...";
        
        const orderId = "NWN-" + Math.floor(Math.random() * 100000);
        fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({'action': 'create_order', 'customerPhone': 'عميل', 'details': details, 'orderId': orderId}),
            keepalive: true
        });

        const msg = encodeURIComponent(`🟢 طلب جديد من نعاون!\n🔖 رقم الطلب: ${orderId}\n📦 التفاصيل: ${details}`);
        setTimeout(() => { window.location.href = `https://wa.me/${ADMIN_PHONE}?text=${msg}`; }, 100);
    }
</script>
</body>
</html>
