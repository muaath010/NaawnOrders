<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ناوون للتوصيل - بوابة العميل</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        #map { height: 300px; border-radius: 12px; margin-top: 15px; border: 2px solid #e2e8f0; z-index: 1;}
    </style>
</head>
<body>
<div class="navbar">
    <h2><i class="fa-solid fa-motorcycle"></i> ناوون للتوصيل</h2>
    <span style="font-size: 14px;">بوابة العملاء</span>
</div>

<div class="container" style="display: grid; grid-template-columns: 1fr; gap: 20px;">
    
    <div class="card">
        <h3><i class="fa-solid fa-box-open"></i> طلب توصيل جديد</h3>
        <textarea id="orderDetails" rows="3" placeholder="تفاصيل الطلب (من أين وإلى أين؟)"></textarea>
        <button onclick="submitOrder()">إرسال الطلب</button>
    </div>

    <div class="card">
        <h3><i class="fa-solid fa-location-crosshairs"></i> التتبع المباشر</h3>
        <input type="text" id="trackId" placeholder="أدخل رقم الطلب هنا (مثال: NWN-1234)">
        <button onclick="startLiveTracking()" style="background: #3b82f6;">بدء التتبع</button>
        
        <div id="trackResult" style="display:none; margin-top: 15px; padding: 10px; background: #f8fafc; border-radius: 8px;">
            <p><strong>حالة الطلب:</strong> <span id="resStatus" class="status-badge" style="background:#f59e0b;"></span></p>
            <p><strong>المندوب:</strong> <span id="resName"></span></p>
        </div>
        
        <div id="map"></div>
    </div>
</div>

<script>
    // رابط الـ API الخاص بك جاهز ومدمج
    const API_URL = "https://script.google.com/macros/s/AKfycbxlU45tFc9sJtd-8F8QSPO-05P_YGSu2wuGsNFyK5kvn8thIu4yum-8lQKKd11uXGVv/exec";
    
    // جلب رقم الزبون الذي سجل به الدخول من الصفحة الرئيسية
    const myPhone = localStorage.getItem("customerPhone");

    // تهيئة الخريطة وتمركزها على إحداثيات ولاية عبري
    let map = L.map('map').setView([23.2292, 56.5167], 13); 
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let driverMarker;
    let trackingInterval;

    // أيقونة سيارة المندوب المخصصة
    let carIcon = L.icon({
        iconUrl: 'https://cdn-icons-png.flaticon.com/512/3204/3204121.png',
        iconSize: [40, 40],
        iconAnchor: [20, 20]
    });

    // --- دالة إرسال الطلب المحدثة والذكية ---
    function submitOrder() {
        const details = document.getElementById('orderDetails').value;
        if(!details) return alert("الرجاء كتابة تفاصيل الطلب أولاً");
        
        // تغيير شكل الزر أثناء التحميل لمنع الضغط المتكرر
        const btn = document.querySelector('button[onclick="submitOrder()"]');
        const originalText = btn.innerText;
        btn.innerText = "جاري الإرسال للتسجيل...";
        btn.disabled = true;
        btn.style.opacity = "0.7";
        
        fetch(API_URL, {
            method: 'POST', 
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ 'action': 'create_order', 'customerPhone': myPhone || 'عميل غير مسجل', 'details': details })
        })
        .then(res => {
            if (!res.ok) throw new Error('Network response was not ok');
            return res.json();
        })
        .then(data => {
            if(data.status === "success") {
                alert('تم استلام طلبك بنجاح! رقم التتبع الخاص بك هو: ' + data.orderId);
                document.getElementById('trackId').value = data.orderId;
                document.getElementById('orderDetails').value = ''; // تفريغ الصندوق
            } else {
                alert('حدث خطأ من الخادم: ' + data.message);
            }
        })
        .catch(error => {
            alert("فشل الاتصال بقاعدة البيانات. تأكد من أنك قمت بعمل New Deployment في جوجل شيت.");
            console.error("تفاصيل العطل التقني:", error);
        })
        .finally(() => {
            // إعادة الزر لشكله الطبيعي دائماً سواء نجح أو فشل
            btn.innerText = originalText;
            btn.disabled = false;
            btn.style.opacity = "1";
        });
    }

    // --- دوال التتبع الحي على الخريطة ---
    function startLiveTracking() {
        const orderId = document.getElementById('trackId').value;
        if(!orderId) return alert("أدخل رقم الطلب");
        
        document.getElementById('trackResult').style.display = 'block';
        if(trackingInterval) clearInterval(trackingInterval); // إيقاف أي تتبع سابق

        // جلب الموقع فوراً ثم كل 15 ثانية
        fetchLocation(orderId);
        trackingInterval = setInterval(() => fetchLocation(orderId), 15000);
    }

    function fetchLocation(orderId) {
        fetch(API_URL + "?action=track_order&orderId=" + orderId)
        .then(res => res.json())
        .then(data => {
            if(data.status === "success") {
                document.getElementById('resStatus').innerText = data.orderStatus;
                document.getElementById('resName').innerText = data.driverName || 'لم يتم التعيين بعد';
                
                if(data.orderStatus === "تم التوصيل") {
                    document.getElementById('resStatus').style.background = "#10b981";
                    clearInterval(trackingInterval); // إيقاف التتبع عند الانتهاء
                }

                // تحديث الخريطة إذا كانت هناك إحداثيات للمندوب
                if(data.lat && data.lng) {
                    const latLng = [parseFloat(data.lat), parseFloat(data.lng)];
                    
                    if(!driverMarker) {
                        driverMarker = L.marker(latLng, {icon: carIcon}).addTo(map).bindPopup("المندوب هنا!");
                        map.setView(latLng, 15);
                    } else {
                        driverMarker.setLatLng(latLng); // تحريك السيارة بنعومة للموقع الجديد
                    }
                }
            } else {
                // لا نظهر تنبيه خطأ مزعج كل 15 ثانية، نكتفي بتغيير النص
                document.getElementById('resStatus').innerText = "رقم الطلب غير صحيح";
                document.getElementById('resStatus').style.background = "#ef4444";
                clearInterval(trackingInterval);
            }
        })
        .catch(err => console.error("خطأ في جلب التتبع:", err));
    }
</script>
</body>
</html>
